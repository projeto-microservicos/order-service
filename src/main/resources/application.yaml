server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: order
  datasource:
    url: jdbc:postgresql://${DATABASE_HOST:db}:${DATABASE_PORT:5432}/${DATABASE_DB:store}?sslmode=${DATABASE_SSLMODE:disable}
    username: ${DATABASE_USERNAME:store}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
      connection-timeout: 3000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 500ms
      timeout: 500ms
      repositories:
        enabled: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:store}
    password: ${RABBITMQ_PASSWORD:}
    connection-timeout: 2s
    publisher-confirm-type: correlated
    publisher-returns: true
    dynamic: ${store.messaging.enabled}
    template:
      mandatory: true
    listener:
      simple:
        # A failed message is never requeued in a loop: it goes to orders.created.dlq (OrderConfirmationWorker).
        default-requeue-rejected: false
        prefetch: 10
  flyway:
    schemas: orders
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: orders
management:
  health:
    redis:
      enabled: ${store.cache.enabled}
    rabbit:
      enabled: ${store.messaging.enabled}
  server:
    port: ${MANAGEMENT_PORT:9091}
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: order
    distribution:
      percentiles-histogram:
        http.server.requests: true

store:
  product-url: ${PRODUCT_URL:http://product:8080}
  exchange-url: ${EXCHANGE_URL:http://exchange:8080}
  cache:
    enabled: ${CACHE_ENABLED:false}
    ttl: ${CACHE_TTL:5m}
  messaging:
    enabled: ${MESSAGING_ENABLED:false}
    poll-delay: ${OUTBOX_POLL_DELAY:1000}
    # BOT-03: consumer of orders.created (needs MESSAGING_ENABLED=true too). Off by default.
    worker-enabled: ${ORDER_WORKER_ENABLED:false}
    # Demo only: artificial processing time, to show POST /orders does not wait for the consumer.
    worker-delay: ${ORDER_WORKER_DELAY:0s}
  security:
    jwt-enabled: ${JWT_ENABLED:false}
    issuer-uri: ${JWT_ISSUER_URI:}
    audience: ${JWT_AUDIENCE:order-service}
  payments:
    enabled: ${PAYMENTS_ENABLED:false}
    secret-key: ${STRIPE_SECRET_KEY:}
    base-url: https://api.stripe.com
    api-version: 2026-10-28.endive
