server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: order
  datasource:
    url: jdbc:postgresql://${DATABASE_HOST:db}:${DATABASE_PORT:5432}/${DATABASE_DB:store}?sslmode=${DATABASE_SSLMODE:disable}
    username: ${DATABASE_USERNAME:store}
    password: ${DATABASE_PASSWORD}
  flyway:
    schemas: orders
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: orders
management:
  server:
    port: ${MANAGEMENT_PORT:9091}
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

store:
  product-url: ${PRODUCT_URL:http://product:8080}
  exchange-url: ${EXCHANGE_URL:http://exchange:8080}
