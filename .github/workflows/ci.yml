name: Verify order service
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B -ntp verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: java-test-results
          path: target/surefire-reports/
      - name: Check Jenkins release script
        run: python3 -m unittest discover -s tests_ci -v
      - name: Scan runtime dependencies
        run: bash scripts/scan.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vulnerability-report
          path: artifacts/vulnerabilities.json
      - name: Build independent container
        run: docker build -t store/order-service:ci .
      - name: Validate development Compose
        run: python3 scripts/init-env.py && docker compose config --quiet
