name: Order CI/CD
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to EKS after publishing (requires the database and cluster access)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B -ntp verify
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: java-test-results
          path: target/surefire-reports/
      - name: Check release scripts
        run: python3 -m unittest discover -s tests_ci -v
      - name: Scan runtime dependencies
        run: bash scripts/scan.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vulnerability-report
          path: artifacts/vulnerabilities.json
      - name: Build independent container
        run: docker build -t store/order-service:ci .
      - name: Validate development Compose
        run: python3 scripts/init-env.py && docker compose config --quiet
  release:
    needs: verify
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && vars.RELEASE_ENABLED == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: order-eks-release
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      SERVICE: order
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'order-service' }}
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
      K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE || 'store' }}
      KUBECTL_VERSION: ${{ vars.KUBECTL_VERSION }}
      IMAGE_PLATFORM: ${{ vars.IMAGE_PLATFORM || 'linux/amd64' }}
      RELEASE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      DEPLOY: ${{ (github.event_name == 'workflow_dispatch' && inputs.deploy || github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true') && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v7
      - name: Check release configuration
        shell: bash
        run: |
          for name in AWS_REGION AWS_ACCOUNT_ID AWS_ROLE_ARN; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Set repository variable $name"
              exit 1
            fi
          done
          if [[ "$DEPLOY" == true ]]; then
            for name in EKS_CLUSTER_NAME KUBECTL_VERSION; do
              if [[ -z "${!name}" ]]; then
                echo "::error::Set repository variable $name before enabling deployment"
                exit 1
              fi
            done
          fi
      - name: Authenticate to AWS with OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          role-session-name: order-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Enable ARM64 builds
        if: env.IMAGE_PLATFORM == 'linux/arm64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Install kubectl
        if: env.DEPLOY == 'true'
        uses: azure/setup-kubectl@v4
        with:
          version: ${{ env.KUBECTL_VERSION }}
      - name: Publish to ECR and optionally deploy to EKS
        run: bash scripts/release-eks.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/release.json
            artifacts/deployment.yaml
          if-no-files-found: ignore
