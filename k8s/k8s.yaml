apiVersion: apps/v1
kind: Deployment
metadata:
  name: order
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: order
  template:
    metadata:
      labels:
        app: order
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      containers:
      - name: order
        image: store/order-service:dev
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        - name: management
          containerPort: 9091
        envFrom:
        - configMapRef:
            name: order-config
        - secretRef:
            name: order-secrets
        # Keep these disabled on the current cluster, including with an older ConfigMap.
        env:
        - name: CACHE_ENABLED
          value: 'false'
        # BOT-04: EDA on. Outbox relay publishes OrderCreated to RabbitMQ (k8s/rabbitmq.yaml, applied by hand) and
        # OrderConfirmationWorker consumes it. Needs RABBITMQ_HOST in order-config and RABBITMQ_PASSWORD in order-secrets.
        - name: MESSAGING_ENABLED
          value: 'true'
        - name: ORDER_WORKER_ENABLED
          value: 'true'
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 250m
            memory: 384Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        startupProbe:
          httpGet:
            path: /orders/health-check
            port: http
          timeoutSeconds: 3
          failureThreshold: 60
          periodSeconds: 5
        # Same Tomcat threads as the traffic: generous timeout so a busy pod is not restarted under load.
        livenessProbe:
          httpGet:
            path: /orders/health-check
            port: http
          timeoutSeconds: 5
          failureThreshold: 4
          periodSeconds: 15
        # Readiness stays on the actuator: it goes OUT_OF_SERVICE during graceful shutdown.
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: management
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: order
spec:
  type: ClusterIP
  selector:
    app: order
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: order-metrics
spec:
  selector:
    app: order
  ports:
  - name: management
    port: 9091
    targetPort: 9091
