# Copy to config.local.yaml and set real endpoints before applying.
apiVersion: v1
kind: ConfigMap
metadata:
  name: order-config
data:
  SERVER_PORT: '8080'
  MANAGEMENT_PORT: '9091'
  DATABASE_HOST: REPLACE_WITH_RDS_ENDPOINT
  DATABASE_PORT: '5432'
  DATABASE_DB: store
  # RDS PostgreSQL 15+ forces TLS (rds.force_ssl=1); the application default is "disable".
  DATABASE_SSLMODE: require
  PRODUCT_URL: http://product:8080
  EXCHANGE_URL: http://exchange:8080
  # Enable after provisioning these dependencies; credentials belong in order-secrets.
  CACHE_ENABLED: 'false'
  REDIS_HOST: REPLACE_WITH_REDIS_HOST
  CACHE_TTL: 5m
  # The Deployment sets MESSAGING_ENABLED/ORDER_WORKER_ENABLED explicitly (k8s/k8s.yaml).
  MESSAGING_ENABLED: 'true'
  ORDER_WORKER_ENABLED: 'true'
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: '5672'
  RABBITMQ_USERNAME: store
  JWT_ENABLED: 'false'
  JWT_ISSUER_URI: ''
  JWT_AUDIENCE: order-service
  PAYMENTS_ENABLED: 'false'
