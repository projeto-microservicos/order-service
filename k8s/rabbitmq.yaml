# BOT-02: RabbitMQ no namespace store (broker do EDA; o order produz e consome OrderCreated).
# Desenho: backend/conhecimento/mensageria.md. NÃO é aplicado pelo CI do order (o release só aplica k8s/k8s.yaml).
#
# Antes de aplicar, crie o Secret com uma senha aleatória (nunca versionada; não aparece em argv nem em log):
#   kubectl -n store create secret generic rabbitmq-secrets \
#     --from-literal=RABBITMQ_DEFAULT_USER=store \
#     --from-file=RABBITMQ_DEFAULT_PASS=<(openssl rand -hex 24 | tr -d '\n')
#   kubectl -n store apply -f k8s/rabbitmq.yaml
#   kubectl -n store rollout status statefulset/rabbitmq --timeout=180s
#   kubectl -n store exec rabbitmq-0 -- rabbitmq-diagnostics -q check_running
#
# UI de gerenciamento só por port-forward (sem porta pública):
#   kubectl -n store port-forward svc/rabbitmq 15672:15672   -> http://localhost:15672
#
# Persistência: emptyDir, porque o cluster não tem o driver EBS (CSI) e um PVC ficaria Pending.
# Risco aceito: se o pod reiniciar, mensagens publicadas e ainda não consumidas se perdem (a outbox do order
# já as marcou como entregues). Para durabilidade: add-on aws-ebs-csi-driver + volumeClaimTemplates de 1 GiB.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-config
  labels:
    app: rabbitmq
    app.kubernetes.io/part-of: store
data:
  90-store.conf: |
    # ~40% do limite do container: o broker bloqueia publicações antes de o kernel matar o pod por OOM.
    vm_memory_high_watermark.absolute = 200MiB
    # Com emptyDir de 1 GiB, para de aceitar publicações antes de encher o volume.
    disk_free_limit.absolute = 200MB
    # Sem login do usuário guest (só vale em localhost, mas fica explícito).
    loopback_users.guest = true
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  labels:
    app: rabbitmq
    app.kubernetes.io/part-of: store
spec:
  type: ClusterIP
  selector:
    app: rabbitmq
  ports:
  - name: amqp
    port: 5672
    targetPort: amqp
  - name: management
    port: 15672
    targetPort: management
---
# Service headless exigido pelo StatefulSet (nome DNS estável rabbitmq-0.rabbitmq-headless).
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-headless
  labels:
    app: rabbitmq
    app.kubernetes.io/part-of: store
spec:
  clusterIP: None
  selector:
    app: rabbitmq
  ports:
  - name: amqp
    port: 5672
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  labels:
    app: rabbitmq
    app.kubernetes.io/part-of: store
spec:
  serviceName: rabbitmq-headless
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
        app.kubernetes.io/part-of: store
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 100      # usuário rabbitmq da imagem alpine
        runAsGroup: 101
        fsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: rabbitmq
        # rabbitmq:4.2-management-alpine fixada por digest (17/11/2026, índice multi-arquitetura)
        image: docker.io/library/rabbitmq@sha256:8639420fa83139a4dda18e210aa524ed69e918924a5f4ad183150b5a59a95c57
        ports:
        - name: amqp
          containerPort: 5672
        - name: management
          containerPort: 15672
        envFrom:
        - secretRef:
            name: rabbitmq-secrets
        env:
        # Nome de nó estável: com emptyDir isso não preserva dados, mas evita um nó novo a cada restart.
        - name: RABBITMQ_NODENAME
          value: rabbit@localhost
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: ["ALL"]}
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {cpu: 500m, memory: 512Mi}
        startupProbe:
          exec:
            command: ["rabbitmq-diagnostics", "-q", "ping"]
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 30
        livenessProbe:
          exec:
            command: ["rabbitmq-diagnostics", "-q", "ping"]
          periodSeconds: 30
          timeoutSeconds: 15
          failureThreshold: 4
        readinessProbe:
          exec:
            command: ["rabbitmq-diagnostics", "-q", "check_port_connectivity"]
          periodSeconds: 15
          timeoutSeconds: 15
        volumeMounts:
        - name: data
          mountPath: /var/lib/rabbitmq
        - name: config
          mountPath: /etc/rabbitmq/conf.d/90-store.conf
          subPath: 90-store.conf
          readOnly: true
      volumes:
      - name: data
        emptyDir:
          sizeLimit: 1Gi
      - name: config
        configMap:
          name: rabbitmq-config
