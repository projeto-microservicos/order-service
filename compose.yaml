name: store-order
services:
  order:
    build: .
    ports:
    - 127.0.0.1:${HTTP_PORT:-8082}:8080
    environment:
      DATABASE_HOST: order-db
      DATABASE_PORT: '5432'
      DATABASE_DB: ${DB_NAME:-store}
      DATABASE_USERNAME: ${DB_USER:-store}
      DATABASE_PASSWORD: ${DB_PASSWORD:?Run python scripts/init-env.py}
      PRODUCT_URL: ${PRODUCT_URL:-http://product:8080}
      EXCHANGE_URL: ${EXCHANGE_URL:-http://exchange:8080}
    networks:
    - backend
    - services
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://localhost:9091/actuator/health/readiness
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    depends_on:
      order-db:
        condition: service_healthy
  order-db:
    image: postgres:17
    networks:
    - backend
    environment:
      POSTGRES_USER: ${DB_USER:-store}
      POSTGRES_DB: ${DB_NAME:-store}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run python scripts/init-env.py}
    volumes:
    - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 20
networks:
  backend: {}
  services:
    name: store-dev
    external: true
volumes:
  postgres-data: {}
