name: store-order
services:
  order:
    build: .
    ports:
    - 127.0.0.1:${HTTP_PORT:-8082}:8080
    environment:
      DATABASE_HOST: order-db
      DATABASE_PORT: '5432'
      DATABASE_DB: ${DB_NAME:-store}
      DATABASE_USERNAME: ${DB_USER:-store}
      DATABASE_PASSWORD: ${DB_PASSWORD:?Run python scripts/init-env.py}
      PRODUCT_URL: ${PRODUCT_URL:-http://product:8080}
      EXCHANGE_URL: ${EXCHANGE_URL:-http://exchange:8080}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_TTL: ${CACHE_TTL:-5m}
      REDIS_HOST: order-cache
      MESSAGING_ENABLED: ${MESSAGING_ENABLED:-true}
      RABBITMQ_HOST: order-rabbit
      RABBITMQ_USERNAME: store
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Run python scripts/init-env.py}
      JWT_ENABLED: ${JWT_ENABLED:-false}
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:-}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-order-service}
      PAYMENTS_ENABLED: ${PAYMENTS_ENABLED:-false}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
    networks:
    - backend
    - services
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://localhost:8080/orders/health-check
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    depends_on:
      order-db:
        condition: service_healthy
      order-cache:
        condition: service_healthy
      order-rabbit:
        condition: service_healthy
  order-cache:
    image: redis:8.2-alpine
    command: [redis-server, --maxmemory, 128mb, --maxmemory-policy, allkeys-lru]
    networks: [backend]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  order-rabbit:
    image: rabbitmq:4.2-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: store
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Run python scripts/init-env.py}
    networks: [backend]
    volumes:
    - rabbit-data:/var/lib/rabbitmq
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 10s
      timeout: 5s
      retries: 20
  prometheus:
    image: prom/prometheus:v3.16.0
    profiles: [monitoring]
    ports:
    - 127.0.0.1:${PROMETHEUS_PORT:-9090}:9090
    networks: [backend]
    volumes:
    - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - prometheus-data:/prometheus
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.retention.time=7d]
    depends_on:
      order:
        condition: service_healthy
  grafana:
    image: grafana/grafana:13.3.1
    profiles: [monitoring]
    ports:
    - 127.0.0.1:${GRAFANA_PORT:-3000}:3000
    networks: [backend]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Run python scripts/init-env.py}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
    - grafana-data:/var/lib/grafana
    - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
  order-db:
    image: postgres:17
    networks:
    - backend
    environment:
      POSTGRES_USER: ${DB_USER:-store}
      POSTGRES_DB: ${DB_NAME:-store}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run python scripts/init-env.py}
    volumes:
    - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 20
networks:
  backend: {}
  services:
    name: store-dev
    external: true
volumes:
  postgres-data: {}
  rabbit-data: {}
  prometheus-data: {}
  grafana-data: {}
